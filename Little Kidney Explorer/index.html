<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ครัวสุขภาพ – ด่านอาหารเช้า</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="game-wrap">
      <div id="game"></div>

      <!-- แถบภารกิจด้านบน -->
      <div id="hud-top">
        <div id="mission-title"></div>
        <div id="mission-text"></div>
      </div>

      <!-- แถบเก็บวัตถุดิบด้านขวา -->
      <aside id="hud-right">
        <div class="hud-label">กระเป๋า <b id="bag-count">0/8</b></div>
        <div id="bag-slots"></div>
        <p class="hud-keys">A/D/W/S หรือ ลูกศร เดิน<br>E เก็บ / จัดอาหาร<br>F ดูข้อมูล<br>Esc ปิดหน้าต่าง</p>
      </aside>

      <!-- ปุ่มควบคุมบนมือถือ -->
      <div id="touch">
        <div id="joy"><div id="joy-knob"></div></div>
        <button id="btn-f" class="tbtn" aria-label="ดูข้อมูล">F<small>ข้อมูล</small></button>
        <button id="btn-e" class="tbtn main" aria-label="เก็บ หรือ จัดอาหาร">E<small>เก็บ</small></button>
      </div>

      <div id="toast" class="hidden"></div>

      <!-- หน้าต่างข้อมูลโภชนาการ -->
      <div id="info-modal" class="modal hidden">
        <div class="card info-card">
          <div class="info-head"><span id="im-emoji"></span><div><h2 id="im-name"></h2><p id="im-ref"></p></div></div>
          <table id="im-table"></table>
          <p class="note" id="im-note"></p>
          <div class="actions"><button id="im-close" class="btn">ปิด (Esc)</button></div>
        </div>
      </div>

      <!-- หน้าต่างจัดอาหาร -->
      <div id="plate-modal" class="modal hidden">
        <div class="card plate-card">
          <h2>🍽️ จัดอาหารเช้าใส่จาน</h2>
          <div class="cols">
            <section class="c-items">
              <h3>วัตถุดิบที่เก็บมา</h3>
              <div id="pm-items" class="grid"></div>
            </section>
            <section class="c-plate">
              <h3>จานของฉัน <span id="pm-count">0/3</span></h3>
              <div id="pm-slots"></div>
              <div id="pm-meters"></div>
              <p id="pm-msg"></p>
            </section>
          </div>
          <div class="actions">
            <button id="pm-close" class="btn">ปิด (Esc)</button>
            <button id="pm-confirm" class="btn primary" disabled>ยืนยันอาหารเช้า</button>
          </div>
        </div>
      </div>

      <!-- เตือนก่อนยืนยันเมื่ออาหารยังไม่เหมาะ -->
      <div id="warn-modal" class="modal hidden">
        <div class="card warn-card">
          <h2>⚠️ อาหารจานนี้ยังไม่เหมาะ</h2>
          <ul id="wm-list"></ul>
          <div class="actions">
            <button id="wm-go" class="btn">ยืนยันต่อ</button>
            <button id="wm-back" class="btn primary">กลับไปเลือกใหม่ (Esc)</button>
          </div>
        </div>
      </div>

      <!-- หน้าสรุป -->
      <div id="summary-modal" class="modal hidden">
        <div class="card summary-card">
          <h2>สรุปอาหารเช้าของฉัน</h2>
          <div class="cols">
            <section class="s-left">
              <div id="sm-items"></div>
              <div id="sm-verdict"></div>
              <div id="sm-alerts"></div>
            </section>
            <section class="s-right">
              <table id="sm-table"></table>
              <p id="sm-formula" class="small"></p>
            </section>
          </div>
          <p class="note" id="sm-note"></p>
          <div class="actions"><button id="sm-restart" class="btn primary">เล่นใหม่</button></div>
        </div>
      </div>
    </div>
  </div>

  <div id="rotate">📱 กรุณาหมุนจอเป็นแนวนอนเพื่อเล่น</div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
